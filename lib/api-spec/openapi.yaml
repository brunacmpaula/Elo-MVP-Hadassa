openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Demo authentication and session context
  - name: missionaries
    description: Missionary discovery and follows
  - name: posts
    description: Missionary content
  - name: comments
    description: Supporter comments on missionary content
  - name: prayers
    description: Prayer commitments
  - name: contribution-availability
    description: Supporter availability for needs
  - name: sync
    description: Offline operation synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a demo session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
  /missionaries:
    get:
      operationId: listMissionaries
      tags: [missionaries]
      summary: List missionaries available to supporters
      responses:
        "200":
          description: Missionaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Missionary"
  /missionaries/{missionaryId}:
    get:
      operationId: getMissionary
      tags: [missionaries]
      summary: Get a missionary profile with posts
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
      responses:
        "200":
          description: Missionary profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionaryProfile"
        "404":
          description: Not found
  /missionaries/{missionaryId}/preferences:
    get:
      operationId: getMissionaryPreferences
      tags: [missionaries]
      summary: Get the authenticated missionary's visibility preferences
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
      responses:
        "200":
          description: Profile visibility preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePreferences"
        "401":
          description: Authentication required
        "403":
          description: Only the profile owner can access these preferences
    patch:
      operationId: updateMissionaryPreferences
      tags: [missionaries]
      summary: Update the authenticated missionary's visibility preferences
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePreferences"
      responses:
        "200":
          description: Updated profile visibility preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePreferences"
        "400":
          description: Invalid preferences
        "401":
          description: Authentication required
        "403":
          description: Only the profile owner can update these preferences
  /missionaries/{missionaryId}/follow:
    post:
      operationId: followMissionary
      tags: [missionaries]
      summary: Follow a missionary
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
      responses:
        "200":
          description: Follow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
    delete:
      operationId: unfollowMissionary
      tags: [missionaries]
      summary: Stop following a missionary
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
      responses:
        "200":
          description: Follow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List posts visible to the current user
      parameters:
        - in: query
          name: missionaryId
          schema:
            type: string
          required: false
        - in: query
          name: mine
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a missionary post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Authentication required
        "403":
          description: Missionary role required
  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Edit a missionary post
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Authentication required
        "403":
          description: Only the post owner can edit it
  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      tags: [comments]
      summary: List comments on a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          description: Not found
    post:
      operationId: createPostComment
      tags: [comments]
      summary: Add a supporter comment to a post
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Authentication required
        "403":
          description: Supporter role required
        "404":
          description: Not found
  /posts/{postId}/prayers:
    post:
      operationId: prayForPost
      tags: [prayers]
      summary: Mark that the supporter is praying
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Prayer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerState"
    delete:
      operationId: removePrayer
      tags: [prayers]
      summary: Remove a prayer commitment
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Prayer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerState"
  /posts/{postId}/contribution-availability:
    post:
      operationId: createContributionAvailability
      tags: [contribution-availability]
      summary: Register supporter availability for a need
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "201":
          description: Availability state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionAvailabilityState"
        "401":
          description: Authentication required
        "403":
          description: Supporter role required
        "404":
          description: Not found
    delete:
      operationId: removeContributionAvailability
      tags: [contribution-availability]
      summary: Remove supporter availability for a need
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Availability state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionAvailabilityState"
        "401":
          description: Authentication required
        "403":
          description: Supporter role required
        "404":
          description: Not found
  /missionaries/{missionaryId}/contribution-availabilities:
    get:
      operationId: listMissionaryContributionAvailabilities
      tags: [contribution-availability]
      summary: List supporter availabilities for the missionary's needs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
      responses:
        "200":
          description: Supporter availabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContributionAvailability"
        "401":
          description: Authentication required
        "403":
          description: Only the profile owner can access availabilities
        "404":
          description: Not found
  /missionaries/{missionaryId}/contribution-availabilities/{availabilityId}/feedback:
    post:
      operationId: createContributionAvailabilityFeedback
      tags: [contribution-availability]
      summary: Send a short response to a supporter availability
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MissionaryId"
        - $ref: "#/components/parameters/AvailabilityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionAvailabilityFeedbackInput"
      responses:
        "201":
          description: Sent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionAvailabilityFeedback"
        "400":
          description: Invalid response or availability
        "401":
          description: Authentication required
        "403":
          description: Only the profile owner can send responses
        "404":
          description: Not found
  /sync:
    post:
      operationId: syncOperations
      tags: [sync]
      summary: Process idempotent offline operations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncInput"
      responses:
        "200":
          description: Sync acknowledgements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          description: Authentication required
        "403":
          description: Missionary role required
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    MissionaryId:
      name: missionaryId
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, name, email, role, gender]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [MISSIONARY, SUPPORTER]
        gender:
          type: string
          enum: [FEMALE, MALE]
        missionaryProfileId:
          type: string
          description: Present for missionary accounts and resolved by the server.
    Session:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
    Missionary:
      type: object
      required: [id, userId, name, initials, isFollowed]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        email:
          type: string
          description: Omitted when the missionary hides their email address.
        bio:
          type: string
          description: Omitted when the missionary hides their biography.
        country:
          type: string
          description: Omitted when the missionary hides their location.
        initials: { type: string }
        isFollowed: { type: boolean }
        latestPostType:
          type: ["string", "null"]
          enum: [UPDATE, PRAYER_REQUEST, NEED, null]
    MissionaryProfile:
      allOf:
        - $ref: "#/components/schemas/Missionary"
        - type: object
          required: [posts]
          properties:
            posts:
              type: array
              items:
                $ref: "#/components/schemas/Post"
    ProfilePreferences:
      type: object
      required: [hiddenFields, womenOnlyNotifications]
      properties:
        hiddenFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [email, location, bio]
        womenOnlyNotifications:
          type: boolean
    Post:
      type: object
      required: [id, missionaryId, missionaryName, type, title, content, status, createdAt, updatedAt, prayerCount, prayedByMe, missionarySaved, contributionAvailabilityCount, contributionAvailableByMe, contributionFeedback, media, comments]
      properties:
        id: { type: string }
        missionaryId: { type: string }
        missionaryName: { type: string }
        missionaryCountry:
          type: string
          description: Omitted when the missionary hides their location.
        type:
          type: string
          enum: [UPDATE, PRAYER_REQUEST, NEED]
        title: { type: string }
        content: { type: string }
        status:
          type: string
          enum: [DRAFT, PENDING_SYNC, PUBLISHED, SYNC_FAILED]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        prayerCount: { type: number, minimum: 0 }
        prayedByMe: { type: boolean }
        missionarySaved:
          type: boolean
          description: Whether the authenticated supporter saved this missionary.
        contributionAvailabilityCount:
          type: number
          minimum: 0
          description: Number of supporters who made themselves available for this need.
        contributionAvailableByMe:
          type: boolean
          description: Whether the authenticated supporter is available for this need.
        contributionFeedback:
          allOf:
            - $ref: "#/components/schemas/ContributionAvailabilityFeedback"
          nullable: true
          description: The private response sent to the authenticated supporter for this need.
        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
    PostInput:
      type: object
      required: [missionaryId, type, title, content, clientOperationId]
      properties:
        missionaryId: { type: string }
        type:
          type: string
          enum: [UPDATE, PRAYER_REQUEST, NEED]
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        clientOperationId: { type: string, minLength: 1 }
        media:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/PostMediaInput"
    PostUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
    FollowState:
      type: object
      required: [missionaryId, isFollowed]
      properties:
        missionaryId: { type: string }
        isFollowed: { type: boolean }
    PrayerState:
      type: object
      required: [postId, prayedByMe, prayerCount]
      properties:
        postId: { type: string }
        prayedByMe: { type: boolean }
        prayerCount: { type: number, minimum: 0 }
    ContributionAvailabilityState:
      type: object
      required: [postId, availableByMe, availabilityCount]
      properties:
        postId: { type: string }
        availableByMe: { type: boolean }
        availabilityCount: { type: number, minimum: 0 }
    ContributionAvailability:
      type: object
      required: [id, postId, supporterName, createdAt, feedback]
      properties:
        id: { type: string }
        postId: { type: string }
        supporterName: { type: string }
        createdAt: { type: string, format: date-time }
        feedback:
          allOf:
            - $ref: "#/components/schemas/ContributionAvailabilityFeedback"
          nullable: true
    ContributionAvailabilityFeedbackInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 280
    ContributionAvailabilityFeedback:
      type: object
      required: [id, availabilityId, postId, message, createdAt, updatedAt]
      properties:
        id: { type: string }
        availabilityId: { type: string }
        postId: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PostMediaInput:
      type: object
      required: [clientMediaId, uri, thumbnailUri, mimeType, sizeBytes, width, height]
      properties:
        clientMediaId: { type: string, minLength: 1 }
        uri:
          type: string
          description: Compressed image data URL kept locally until synchronization.
        thumbnailUri:
          type: string
          description: Thumbnail data URL used for fast list rendering.
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: number
          minimum: 1
          maximum: 1500000
          description: Whole number of bytes.
        width: { type: number, minimum: 1 }
        height: { type: number, minimum: 1 }
    PostMedia:
      allOf:
        - $ref: "#/components/schemas/PostMediaInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    CommentInput:
      type: object
      required: [content, clientOperationId]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        clientOperationId: { type: string, minLength: 1 }
    Comment:
      type: object
      required: [id, postId, authorName, content, createdAt]
      properties:
        id: { type: string }
        postId: { type: string }
        authorName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    SyncOperation:
      type: object
      required: [operationId, entityType, entityId, operationType, payload]
      properties:
        operationId: { type: string }
        entityType: { type: string, enum: [POST] }
        entityId: { type: string }
        operationType: { type: string, enum: [CREATE, UPDATE] }
        payload:
          type: object
          additionalProperties: true
    SyncInput:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/SyncOperation"
    SyncAck:
      type: object
      required: [operationId, status, entityId]
      properties:
        operationId: { type: string }
        status:
          type: string
          enum: [SYNCED, FAILED]
        entityId: { type: string }
        error:
          type: ["string", "null"]
    SyncResult:
      type: object
      required: [acks]
      properties:
        acks:
          type: array
          items:
            $ref: "#/components/schemas/SyncAck"